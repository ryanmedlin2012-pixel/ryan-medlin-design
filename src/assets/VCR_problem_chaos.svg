<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400"><title>Disjointed reporting</title><style>
.dr{transform-box:fill-box;transform-origin:center;animation:drift var(--d) ease-in-out var(--dl) infinite}
@keyframes drift{0%,100%{transform:none}33%{transform:translate(var(--x1),var(--y1)) rotate(var(--r1))}66%{transform:translate(var(--x2),var(--y2)) rotate(var(--r2))}}
.f{animation:flicker var(--fd) ease-in-out var(--fdl) infinite}
