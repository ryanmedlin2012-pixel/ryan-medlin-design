<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design Portfolio</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: encode the full path into the query string
      // so index.html can restore it via history.replaceState.
      // pathSegmentsToKeep = 1 preserves the /ryan-medlin-design/ repo segment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      // The redirect below makes the app's own load look like a fresh visit,
      // hiding that the reader actually refreshed (or went back/forward). Pass
      // this load's real type across so the app can still restore positions
      // (see src/hooks/restore.ts).
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        sessionStorage.setItem('spa-redirect-nav', JSON.stringify({
          type: nav ? nav.type : 'navigate',
          at: Date.now()
        }));
      } catch (e) {}
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
